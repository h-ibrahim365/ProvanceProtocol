version: 2

updates:
  # .NET / NuGet
  - package-ecosystem: "nuget"
    directory: "/src/dotnet"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Java / Maven
  - package-ecosystem: "maven"
    directory: "/src/java"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Python / PyPI
  - package-ecosystem: "pip"
    directory: "/src/python"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
