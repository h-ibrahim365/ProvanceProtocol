name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  SOLUTION: src/dotnet/ProvanceProtocol/ProvanceProtocol.sln
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Decides which parts of the repository changed, so a push that only touches Python does not rebuild .NET, Java
  # and the site. Changes to the shared test vectors or to this workflow run everything.
  changes:
    name: Changed parts
    runs-on: ubuntu-latest
    outputs:
      dotnet: ${{ steps.diff.outputs.dotnet }}
      java: ${{ steps.diff.outputs.java }}
      python: ${{ steps.diff.outputs.python }}
      site: ${{ steps.diff.outputs.site }}
      vectors: ${{ steps.diff.outputs.vectors }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$BASE" =~ ^[0-9a-f]{40}$ && ! "$BASE" =~ ^0+$ ]] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BASE" "$GITHUB_SHA")
          else
            files="(unknown base, everything runs)"
            all=true
          fi
          shared='^(docs/test-vectors/|\.github/workflows/ci\.yml$)'
          changed() {
            if [[ "${all:-}" == true ]] || grep -qE "$1|$shared" <<<"$files"; then echo true; else echo false; fi
          }
          {
            echo "dotnet=$(changed '^src/dotnet/')"
            echo "java=$(changed '^src/java/')"
            echo "python=$(changed '^src/python/')"
            echo "site=$(changed '^site/')"
            echo "vectors=$(changed '^docs/test-vectors/')"
          } | tee -a "$GITHUB_OUTPUT"
          { echo '### Changed files'; echo '```'; echo "$files"; echo '```'; } >>"$GITHUB_STEP_SUMMARY"

  dotnet:
    name: .NET
    needs: changes
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore "$SOLUTION"

      - name: Build
        run: dotnet build "$SOLUTION" -c Release --no-restore

      # PostgreSQL and SQL Server tests start containers through Testcontainers (Docker is available on ubuntu-latest).
      # SQLite tests need nothing.
      - name: Test
        run: dotnet test "$SOLUTION" -c Release --no-build --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: TestResults

  test-vectors:
    name: Test vectors
    needs: changes
    if: needs.changes.outputs.vectors == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check test vectors with an independent implementation
        run: |
          pip install rfc8785==0.1.4
          python docs/test-vectors/verify.py

  java:
    name: Java ${{ matrix.java }}
    needs: changes
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21"]
    defaults:
      run:
        working-directory: src/java
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # PostgreSQL, SQL Server and MySQL tests start containers through Testcontainers. H2 and SQLite need nothing.
      - name: Build and test
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: java-${{ matrix.java }}-surefire-reports
          path: src/java/**/target/surefire-reports

  python:
    name: Python ${{ matrix.python }}
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: provance
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: src/python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: pip install -e ".[test,postgres]"

      - name: Test (SQLite, PostgreSQL, shared vectors, Java ledger fixture)
        run: pytest
        env:
          PROVANCE_TEST_POSTGRES_URL: postgresql://postgres:provance@localhost:5432/postgres

      - name: Build the distribution
        if: matrix.python == '3.13'
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*

  site:
    name: Demo site
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Demo site (shared vectors, Java ledger fixture, type check, build)
        working-directory: site
        run: |
          npm ci
          npm test
          npm run check
          npm run build

      - name: Status service (format, lint, tests)
        working-directory: site/server
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
