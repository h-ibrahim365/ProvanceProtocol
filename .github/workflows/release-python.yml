name: Release (Python)

# Publishing a GitHub release tagged python-vX.Y.Z builds, tests and uploads the Python package to PyPI.
# Trusted Publishing: no token is stored in the repository. Configure the publisher once on pypi.org
# (owner h-ibrahim365, repository ProvanceProtocol, workflow release-python.yml, environment pypi).
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    if: startsWith(github.event.release.tag_name, 'python-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check that the tag matches pyproject.toml
        run: |
          TAG="${GITHUB_REF_NAME#python-v}"
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG pyproject=$VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Release tag python-v$TAG does not match version $VERSION in src/python/pyproject.toml"
            exit 1
          fi

      - name: Test
        run: |
          pip install -e ".[test]"
          pytest

      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: src/python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
