name: Deploy demo site

# Builds the demo site and the status service, then copies them to the VPS over SSH.
# Repository secrets: SITE_SSH_KEY (private key of the deploy user), SITE_HOST, SITE_USER, SITE_KNOWN_HOSTS
# (output of `ssh-keyscan -t ed25519 <host>`). Repository variable VPS_ARCH: x64 (default) or arm64.
# Server setup: site/deploy/README.md.

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/test-vectors/**", ".github/workflows/deploy-site.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ vars.VPS_ARCH == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build the site
        working-directory: site
        run: |
          npm ci
          npm test
          npm run build

      - name: Build the status service (static binary)
        working-directory: site/server
        run: |
          TARGET="$(uname -m)-unknown-linux-musl"
          sudo apt-get update -q && sudo apt-get install -y -q musl-tools
          rustup target add "$TARGET"
          cargo test
          cargo build --release --target "$TARGET"
          cp "target/$TARGET/release/provance-status" ../dist-status

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: |
            site/dist
            site/dist-status
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment: demo-site
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SITE_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SITE_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload and restart
        env:
          HOST: ${{ secrets.SITE_HOST }}
          USER: ${{ secrets.SITE_USER }}
        run: |
          SSH="ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes"
          rsync -az --delete -e "$SSH" dist/ "$USER@$HOST:/var/www/provance-demo/"
          rsync -az -e "$SSH" dist-status "$USER@$HOST:/opt/provance-status/provance-status.new"
          $SSH "$USER@$HOST" 'chmod 755 /opt/provance-status/provance-status.new &&
            mv /opt/provance-status/provance-status.new /opt/provance-status/provance-status &&
            sudo /usr/bin/systemctl restart provance-status &&
            sleep 2 && curl -fsS http://127.0.0.1:8787/api/health'

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/id_deploy
