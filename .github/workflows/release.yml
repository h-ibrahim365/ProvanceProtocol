name: Release

# Publishing a GitHub release tagged vX.Y.Z builds, tests and pushes the three packages to NuGet.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

env:
  SOLUTION: src/dotnet/ProvanceProtocol/ProvanceProtocol.sln
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Check that the tag matches Directory.Build.props
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PROPS=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/dotnet/ProvanceProtocol/Directory.Build.props)
          echo "tag=$TAG props=$PROPS"
          if [ "$TAG" != "$PROPS" ]; then
            echo "::error::Release tag v$TAG does not match <Version>$PROPS</Version> in Directory.Build.props"
            exit 1
          fi

      - name: Restore
        run: dotnet restore "$SOLUTION"

      - name: Build
        run: dotnet build "$SOLUTION" -c Release --no-restore

      - name: Test
        run: dotnet test "$SOLUTION" -c Release --no-build

      - name: Pack
        run: |
          for project in Provance.Core Provance.AspNetCore.Middleware Provance.Storage.EntityFrameworkCore; do
            dotnet pack "src/dotnet/ProvanceProtocol/$project/$project.csproj" -c Release --no-build --output nupkg
          done

      - name: NuGet login (Trusted Publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: HakimBuilds

      - name: Push to NuGet
        run: dotnet nuget push "nupkg/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
