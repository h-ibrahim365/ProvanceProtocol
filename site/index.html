      <h1>PROVANCE: an audit log that shows when someone changed it</h1>
      <p>
        PROVANCE is an open source, tamper-evident audit trail for .NET, Java and Python. Every entry your application
        records is chained to the previous one with SHA-256 and signed, in your own database. If someone edits,
        deletes or reorders entries, verification tells you exactly where.
      </p>
