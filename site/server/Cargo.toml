[package]
name = "provance-status"
version = "0.1.0"
edition = "2024"
description = "Release status of the PROVANCE packages for the demo site: GitHub Actions, NuGet, Maven Central, PyPI."
license = "MIT"
publish = false

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
humantime = "2.4.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "gzip", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
